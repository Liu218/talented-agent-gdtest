[project]
name = "stock-mcp"
version = "0.1.0"
description = "A 股股票 MCP Server：搜索、行情查询、条件选股"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "akshare>=1.16.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
